# GeoLLM 前端（dist 静态站点）Nginx 配置
#
# 挂载位置：/etc/nginx/conf.d/default.conf（因此本文件只写 server 块）
# 使用说明见同目录 README.md

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 上传体量：矢量文件可达数百 MB，需 ≥ 后端 spring.servlet.multipart 的限制
    client_max_body_size 1024m;

    # ---------------------------------------------------------------
    # 后端反向代理
    #
    # 前端运行时配置 dist/config.json 里把 VITE_SERVICE_REAL_BASE_URL 设为 "/api"，
    # 于是所有后端请求都变成 /api/xxx，由这里转发给后端。
    #
    # 后端 context-path 为 "/"，端口：prod 18000 / dev 8000。
    # proxy_pass 末尾的 "/" 是「替换」语义：/api/auth/login → /auth/login
    # （恰好剥掉一层 /api；前端调 /api/dify/... 时 → /api/dify/...，与后端一致）
    # ---------------------------------------------------------------
    location /api/ {
        # 后端跑在宿主机（systemd / JSW）时用 host.docker.internal；
        # 若后端也在 compose 里，改成服务名，例如 http://geo-llm-admin:18000/
        proxy_pass http://host.docker.internal:18000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 流式响应（SSE）：必须关缓冲，否则前端要等整段结束才收到
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 后端 WebSocket（config/application-*.yml 里 continew-starter.messaging.websocket.path=/websocket）
    # 当前前端未使用 WebSocket，需要对接时取消注释
    # location /websocket {
    #     proxy_pass http://host.docker.internal:18000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade    $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host       $host;
    #     proxy_read_timeout 3600s;
    # }

    # ---------------------------------------------------------------
    # 缓存策略
    # 注意：这里只用 expires（不写 add_header），否则会覆盖掉下面 server 级的
    #       安全响应头（nginx 的 add_header 不继承，一旦本层出现就整体失效）
    # ---------------------------------------------------------------

    # 运行时配置：必须每次校验，否则改了 config.json 用户端不生效
    # （index.html 用同步 XHR 读取它，拿到旧值会导致后端地址错误）
    location = /config.json {
        expires -1;
    }

    # 入口 HTML：不缓存，保证发版后用户拿到新的资源指纹
    location = /index.html {
        expires -1;
    }

    # 带哈希的构建产物：长期强缓存
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # 地图 / 三维 / 影像等大体积静态数据（public/ 下的目录会原样拷进 dist）
    location ~* \.(?:b3dm|glb|gltf|terrain|pbf|mvt|jpg|jpeg|png|webp|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
    }

    # SPA 路由回退：前端为 history 模式（.env 的 VITE_ROUTER_HISTORY_MODE=history），
    # 刷新 /screen、/agent 这类前端路由时不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    # 注意：不要加 text/event-stream，否则 AI 流式会被缓冲破坏
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 安全响应头（不加 CSP，避免影响 Cesium 与内联首屏壳）
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
