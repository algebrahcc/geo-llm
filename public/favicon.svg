<svg width="100%" height="100%" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!--
    标识：数字地球（圆球 + 经线 + 赤道），概括 GIS / 数字地球。
    与 src/components/common/system-logo.vue 保持同一几何。
    不铺背景色块；深色环境把同一个蓝调亮一档（同 Calcite 的做法）。
  -->
  <style>
    .globe {
      fill: none;
      stroke: #2547c7;
    }

    @media (prefers-color-scheme: dark) {
      .globe {
        stroke: #5b93ff;
      }
    }
  </style>

  <circle class="globe" cx="24" cy="24" r="15" stroke-width="3.2" />
  <ellipse class="globe" cx="24" cy="24" rx="7" ry="15" stroke-width="2.4" />
  <path class="globe" d="M 9.8 24 H 38.2" stroke-width="2.4" />
</svg>
